[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "astropilot"
version = "1.0.0b8"
description = "Astrophotography planning and decision engine"
requires-python = ">=3.11,<3.14"
dependencies = [
    "certifi>=2025.2",
    "astral>=3.2,<4.0",
    "astropy>=7.2,<8.0",
    "fastapi>=0.116,<1.0",
    "requests>=2.32,<3.0",
    "timezonefinder>=8,<9",
    "uvicorn>=0.52,<1.0",
    "tzdata>=2025.2",
]

[project.scripts]
astropilot = "astro_score:main"
astropilot-app = "astropilot.launcher:main"
astropilot-field-lab = "astropilot.reference_station_cli:main"

[project.optional-dependencies]
packaging = [
    "pyinstaller>=6.22,<7.0",
    "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
]
test = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = [
    "tests",
    "decision",
]
pythonpath = [
    ".",
]

[tool.setuptools]
py-modules = ["astro_score"]

[tool.setuptools.package-data]
astropilot = ["knowledge/objects/*.json", "web/*", "reference_stations_v1.json"]

[tool.setuptools.packages.find]
include = [
    "astropilot*",
    "decision*",
]
exclude = [
    "decision.tests*",
]
