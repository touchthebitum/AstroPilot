[project]
name = "astropilot"
version = "0.0.0"
description = "Astrophotography planning and decision engine"
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = [
    "tests",
    "decision",
]
pythonpath = [
    ".",
]

