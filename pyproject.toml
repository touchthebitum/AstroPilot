[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "astropilot"
version = "0.0.0"
description = "Astrophotography planning and decision engine"
requires-python = ">=3.11,<3.14"
dependencies = [
    "astral>=3.2,<4.0",
    "astropy>=7.2,<9.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = [
    "tests",
    "decision",
]
pythonpath = [
    ".",
]

[tool.setuptools]
py-modules = ["astro_score"]

[tool.setuptools.packages.find]
include = [
    "astropilot*",
    "decision*",
]
