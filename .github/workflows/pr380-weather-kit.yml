name: PR380 isolated Windows weather kit qualification
on:
  workflow_dispatch:
    inputs:
      build_run:
        required: true
        type: string
      portable_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tooling
          persist-credentials: false
      - name: Download exact PR380 candidate and portable Python
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP 'pr380-artifacts'
          gh run download ${{ inputs.build_run }} --repo touchthebitum/AstroPilot --name PR380-windows-331093b523673ac267d491f127584921dce096a7 --dir "$artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          "PR380_ARCHIVE_ROOT=$artifacts" >> $env:GITHUB_ENV
          "KIT_EXPECTED_PORTABLE_SHA=${{ inputs.portable_sha256 }}" >> $env:GITHUB_ENV
          $pythonZip = Join-Path $env:RUNNER_TEMP 'python-3.13.5-embed-amd64.zip'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.13.5/python-3.13.5-embed-amd64.zip' -OutFile $pythonZip
          if ((Get-FileHash $pythonZip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '7d2650fd9d1b9d002d4a315d5f354247fd6a44f30517c7ef577b08f57a0fb6d9') { throw 'Python archive mismatch' }
          Expand-Archive -LiteralPath $pythonZip -DestinationPath tooling/python-portable-3.13.5
          Add-Content -LiteralPath tooling/python-portable-3.13.5/python313._pth -Value '..'
      - name: Qualify native binary with portable interpreter and synthetic profiles only
        shell: pwsh
        run: |
          & tooling/python-portable-3.13.5/python.exe tooling/qualify-weather-kit.py
          if ($LASTEXITCODE -ne 0) { throw 'Weather kit qualification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PR380-weather-kit-qualification
          path: |
            ${{ runner.temp }}/pr380-weather-qualification/qualification*.json
            ${{ runner.temp }}/pr380-weather-qualification/qualification*.txt
            ${{ runner.temp }}/pr380-weather-qualification/qualification*.zip
          if-no-files-found: warn
