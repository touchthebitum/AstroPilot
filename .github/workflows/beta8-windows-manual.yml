name: Isolated session replay and restart qualification
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed product source
        required: true
        type: string
permissions:
  contents: read
jobs:
  session:
    name: Session qualification ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          persist-credentials: false
          sparse-checkout: tooling/session-qualification
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.12'
          version: '0.12.5'
      - name: Install isolated dependencies and require exact source
        working-directory: source
        shell: pwsh
        run: |
          if ('${{ inputs.approved_sha }}' -cne 'e110de5f0a2b8b8c9f7558beba0bd074d2c042b1') { throw 'Unexpected product source' }
          if ((git rev-parse HEAD).Trim() -cne '${{ inputs.approved_sha }}') { throw 'Source mismatch' }
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'session-uv-cache'
          uv sync --locked --extra test
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node required' }
          New-Item -ItemType Directory -Force tooling/session-qualification | Out-Null
          Copy-Item ../operations/tooling/session-qualification/qualify.py tooling/session-qualification/qualify.py
      - name: Qualify durable APIs with fresh processes and synthetic profile
        working-directory: source
        shell: pwsh
        run: |
          $env:UV_NO_ENV_FILE = '1'
          uv run --locked --no-sync python tooling/session-qualification/qualify.py (Join-Path $env:RUNNER_TEMP 'session-process-proof')
          if ($LASTEXITCODE -ne 0) { throw 'Session qualification failed' }
      - name: Qualify regressions in isolated profile and home
        working-directory: source
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'session-focused'
          foreach ($entry in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';ASTROPILOT_DATA_DIR='data';TMP='tmp';TEMP='tmp';TMPDIR='tmp';XDG_CACHE_HOME='cache'}.GetEnumerator()) {
            $dir = Join-Path $iso $entry.Value
            New-Item -ItemType Directory -Force $dir | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key, $dir)
          }
          uv run --locked --no-sync python -m pytest -q tests/api/test_execution_session_api.py tests/api/test_execution_session_ui.py tests/api/test_project_progress_api.py tests/services/test_intent_progress_credit.py tests/services/test_execution_outcome_application.py tests/services/test_execution_transition.py tests/architecture/test_execution_lineage_persistence.py tests/guardian/test_guardian_session_lifecycle.py --junitxml="$env:RUNNER_TEMP/session-focused/junit.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Regression qualification failed' }
      - name: Export synthetic proof only, no profile or keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-qualification-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/session-process-proof/qualification.json
            ${{ runner.temp }}/session-focused/junit.xml
