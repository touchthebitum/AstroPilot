name: PR376 Windows candidate build and validation
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
      validation_only:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  windows:
    if: ${{ !inputs.validation_only }}
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      APPROVED_SHA: ${{ inputs.approved_sha }}
      UV_PROJECT_ENVIRONMENT: .venv-packaging
      UV_NO_ENV_FILE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
      - name: Guard exact source and isolated directories
        run: |
          if ($env:APPROVED_SHA -cne 'a6f5bd8e454d3de28dd9cc5f23408efabca6e0a1') { throw 'Unexpected product SHA' }
          if ((git rev-parse HEAD).Trim() -cne $env:APPROVED_SHA) { throw 'Checkout mismatch' }
          if (git status --porcelain) { throw 'Dirty source' }
          $iso = Join-Path $env:RUNNER_TEMP 'beta8-common-isolation'
          New-Item -ItemType Directory -Path $iso -ErrorAction Stop
          foreach ($entry in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';ASTROPILOT_DATA_DIR='data';UV_CACHE_DIR='cache';TMP='tmp';TEMP='tmp'}.GetEnumerator()) {
            $dir = Join-Path $iso $entry.Value
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            "$($entry.Key)=$dir" >> $env:GITHUB_ENV
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Missing preinstalled Inno Setup' }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
          "INNO_SETUP_VERSION=$((Get-Item $iscc).VersionInfo.FileVersion)" >> $env:GITHUB_ENV
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Build exact committed product
        run: |
          uv python install 3.13.5
          if ($LASTEXITCODE -ne 0) { throw 'Python install failed' }
          uv lock --check --no-python-downloads
          if ($LASTEXITCODE -ne 0) { throw 'Lock mismatch' }
          uv run --no-project --no-sync python scripts/build_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (Test-Path astropilot.egg-info) { Move-Item astropilot.egg-info (Join-Path $env:RUNNER_TEMP 'generated-beta8-egg-info') }
          if (git status --porcelain --untracked-files=all) { throw 'Source changed' }
      - name: Scan payload and build installer without installing it
        run: |
          uv run --locked --no-sync python ../operations/tooling/export_windows.py --check-payload-only
          if ($LASTEXITCODE -ne 0) { throw 'Payload scan failed' }
          uv run --locked --no-sync python scripts/build_windows_installer.py --iscc "$env:ISCC_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          uv run --locked --no-sync python ../operations/tooling/export_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Export failed' }
      - name: Validate native executable with fictitious evidence only
        run: |
          $validation = Join-Path $env:RUNNER_TEMP 'beta8-native-binary-validation'
          uv run --locked --no-sync python ../operations/tooling/validate_binary.py --binary dist/AstroPilot/AstroPilot.exe --source . --work "$validation" --expected-sha "$env:APPROVED_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Native binary validation failed' }
          Copy-Item (Join-Path $validation 'validation.json') dist/beta8-artifacts/native-windows-validation.json
          Compress-Archive -Path (Join-Path $validation 'logs/*') -DestinationPath dist/beta8-artifacts/native-windows-validation-logs.zip
          if (git status --porcelain --untracked-files=all) { throw 'Source changed during native tests' }
      - name: Validate extracted ZIP and installer in disposable runner temp
        run: |
          uv run --locked --no-sync python ../operations/tooling/validate_windows_artifacts.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable or installer validation failed' }
      - name: Validate explicit acquisition choice and lineage on Windows
        run: |
          $env:UV_PROJECT_ENVIRONMENT = '.venv-validation'
          uv sync --locked --extra test
          if ($LASTEXITCODE -ne 0) { throw 'Validation dependencies failed' }
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node required for UI tests' }
          uv run --locked --no-sync python -m pytest tests/architecture/test_tonight_application_service.py tests/architecture/test_session_availability.py tests/api/test_intent_choice_ui.py tests/services/test_user_selection_mission.py tests/services/test_decision_acceptance_application.py tests/architecture/test_decision_acceptance_lineage_persistence.py tests/architecture/test_production_acquisition_intent_composition.py tests/architecture/test_tonight_creation_refusal.py -q --junitxml=dist/beta8-artifacts/windows-intent-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Acquisition and lineage tests failed' }
          if (Test-Path astropilot.egg-info) { Move-Item astropilot.egg-info (Join-Path $env:RUNNER_TEMP 'generated-beta8-test-egg-info') }
          if (git status --porcelain --untracked-files=all) { throw 'Source changed during tests' }
      - name: Preserve diagnostic result even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PR376-windows-${{ inputs.approved_sha }}
          path: |
            source/dist/beta8-artifacts/*
            ${{ runner.temp }}/beta8-native-binary-validation/validation.json
            ${{ runner.temp }}/beta8-native-portable-validation/validation.json
            ${{ runner.temp }}/beta8-native-portable-validation/logs/*
          if-no-files-found: warn
          retention-days: 30

  kit-harness:
    if: ${{ inputs.validation_only }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tooling
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Retrieve exact built binary for launcher smoke test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP 'pr376-built-artifacts'
          gh run download 38355628182 --repo touchthebitum/AstroPilot --name PR376-windows-a6f5bd8e454d3de28dd9cc5f23408efabca6e0a1 --dir "$artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Binary artifact download failed' }
          "PR376_ARCHIVE_ROOT=$artifacts" >> $env:GITHUB_ENV
      - name: Qualify portable harness with synthetic profiles only
        shell: pwsh
        run: |
          $pythonZip = Join-Path $env:RUNNER_TEMP 'python-3.13.5-embed-amd64.zip'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.13.5/python-3.13.5-embed-amd64.zip' -OutFile $pythonZip
          if ((Get-FileHash $pythonZip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '7d2650fd9d1b9d002d4a315d5f354247fd6a44f30517c7ef577b08f57a0fb6d9') { throw 'Python archive hash mismatch' }
          $runtime = Join-Path $PWD 'tooling/python-portable-3.13.5'
          Expand-Archive -LiteralPath $pythonZip -DestinationPath $runtime
          Add-Content -LiteralPath (Join-Path $runtime 'python313._pth') -Value '..'
          $manifest = @{}
          Get-ChildItem -LiteralPath $runtime -Recurse -File | ForEach-Object {
            $rel = 'python-portable-3.13.5/' + $_.Name
            $manifest[$rel] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content tooling/Manifest-Python.json
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tooling/Preparer-Python-portable.ps1 -RuntimeCheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime verification failed' }
          & (Join-Path $runtime 'python.exe') tooling/validate-kit-windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Kit harness qualification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PR376-kit-harness-validation
          path: ${{ runner.temp }}/pr376-kit-qualification/**/comparison.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PR376-kit-native-safety
          path: ${{ runner.temp }}/pr376-kit-qualification/validation-kit.json
          if-no-files-found: warn
