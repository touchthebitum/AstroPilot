name: Profile decoding recovery qualification
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling/profile_recovery
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: baseline
          ref: dad6e438b8ba0f5ce52d59457ce503e030911d80
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Compare exact main and candidate on isolated public fixtures
        working-directory: candidate
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.approved_sha }}
        run: |
          $iso=Join-Path $env:RUNNER_TEMP 'profile-tool-environment'
          foreach ($entry in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';ASTROPILOT_DATA_DIR='data';UV_CACHE_DIR='cache'}.GetEnumerator()) {
            $dir=Join-Path $iso $entry.Value
            New-Item -ItemType Directory -Force $dir | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key,$dir)
          }
          uv sync --locked --extra test
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          uv run --locked --no-sync python ../operations/tooling/profile_recovery/qualify.py
          if ($LASTEXITCODE -ne 0) { throw 'Qualification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-recovery-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/profile-recovery-proof/result.json
            ${{ runner.temp }}/profile-recovery-proof/*/tests.xml
            ${{ runner.temp }}/profile-recovery-proof/*/pytest.log
