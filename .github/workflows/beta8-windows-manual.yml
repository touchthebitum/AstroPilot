name: Diagnose isolated Windows Chrome sandbox 70ac6e0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tooling/browser_sandbox
            scripts/ci/night_chain
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python tooling/browser_sandbox/diagnose.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-sandbox-proof
          path: |
            ${{ runner.temp }}/sandbox-proof/result.json
            ${{ runner.temp }}/sandbox-proof/*.log
            ${{ runner.temp }}/sandbox-proof/*.html
