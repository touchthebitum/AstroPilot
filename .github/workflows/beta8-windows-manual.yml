name: Isolated Mac browser diagnosis
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tooling/nightchain
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Compare static navigation with isolated browser environments
        shell: bash
        run: |
          test '${{ inputs.approved_sha }}' = dad6e438b8ba0f5ce52d59457ce503e030911d80
          export NATIVE_TEST_HOME="$HOME"
          export NATIVE_TEST_TMPDIR="$TMPDIR"
          uv python find
          uv run --no-project python tooling/nightchain/setup_browser.py
          export CHROME_BINARY="$(cat "$RUNNER_TEMP/night-chain-browser-tool/binary-path.txt")"
          uv run --no-project python tooling/nightchain/diagnose.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-browser-diagnosis
          path: |
            ${{ runner.temp }}/mac-browser-diagnosis
            ${{ runner.temp }}/night-chain-browser-tool/provenance.json
