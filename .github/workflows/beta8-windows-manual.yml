name: Exact main Windows manual kit qualification
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  kit-validation:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PRODUCT_SOURCE: ${{ github.workspace }}/source
      KIT_TEST_ROOT: ${{ runner.temp }}/manual-kit-runtime
      UV_NO_ENV_FILE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling/packaged
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Prepare public synthetic kit with the exact official binary
        working-directory: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((git rev-parse HEAD).Trim() -cne '0dcde494c8450176f445cc29b28d004eddb60734') { throw 'Wrong source' }
          $iso=Join-Path $env:RUNNER_TEMP 'kit-preparation'
          foreach ($entry in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';ASTROPILOT_DATA_DIR='data';UV_CACHE_DIR='cache';TMP='tmp';TEMP='tmp';TMPDIR='tmp'}.GetEnumerator()) {
            $directory=Join-Path $iso $entry.Value
            New-Item -ItemType Directory -Force $directory | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key,$directory)
          }
          uv sync --locked --extra test
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
          gh run download 38732731103 --repo touchthebitum/AstroPilot --name AstroPilot-beta8-windows-x86_64-0dcde494c8450176f445cc29b28d004eddb60734 --dir (Join-Path $env:RUNNER_TEMP 'official-kit-artifacts')
          if ($LASTEXITCODE -ne 0) { throw 'Official artifact download failed' }
          uv run --locked --no-sync python ../operations/tooling/packaged/prepare_manual_kit_ci.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic kit failed' }
      - name: Exercise shipped launcher with public synthetic API actions and verify exported proof
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:KIT_TEST_ROOT 'Lancer-qualification.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          & (Join-Path $env:GITHUB_WORKSPACE 'operations/tooling/packaged/qualify_manual_kit.ps1')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-manual-kit-0dcde49
          path: |
            ${{ runner.temp }}/manual-kit-runtime/Native-kit-validation.json
            ${{ runner.temp }}/manual-kit-runtime/resultats-candidat-*.zip
          if-no-files-found: warn
