name: Isolated process crash recovery qualification
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact product SHA for crash recovery qualification
        required: true
        type: string
permissions:
  contents: read
jobs:
  crash:
    name: Crash recovery ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          persist-credentials: false
          sparse-checkout: tooling/crash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.12'
          version: '0.12.5'
      - name: Install locked dependencies for the exact product
        working-directory: source
        shell: pwsh
        run: |
          if ('${{ inputs.approved_sha }}' -cne 'ee5df1456d0a60e9149ae792efc601e8e57f7c68') { throw 'Unexpected source SHA' }
          if ((git rev-parse HEAD).Trim() -cne '${{ inputs.approved_sha }}') { throw 'Source mismatch' }
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'crash-uv-cache'
          uv sync --locked --extra test
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Kill owned children at deterministic persistence points and recover
        working-directory: source
        shell: pwsh
        run: |
          $env:PRODUCT_SOURCE = (Get-Location).Path
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'crash-uv-cache'
          uv run --locked --no-sync python ../operations/tooling/crash/qualify.py (Join-Path $env:RUNNER_TEMP 'crash-proof')
          if ($LASTEXITCODE -ne 0) { throw 'Crash recovery qualification failed' }
      - name: Export public synthetic proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crash-recovery-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/crash-proof/crash-qualification.json
            ${{ runner.temp }}/crash-proof/*/suspended.json
            ${{ runner.temp }}/crash-proof/*/stdout.log
            ${{ runner.temp }}/crash-proof/*/stderr.log
