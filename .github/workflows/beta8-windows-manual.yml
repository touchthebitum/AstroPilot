name: Public profile authority cross-OS qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: mac_seed
            os: macos-latest
    uses: ./.github/workflows/profile-authority-stage.yml
    with:
      stage: ${{ matrix.stage }}
      os: ${{ matrix.os }}
  windows:
    needs: qualify
    uses: ./.github/workflows/profile-authority-stage.yml
    with:
      stage: windows
      os: windows-2022
      incoming: mac_seed
  mac_return:
    needs: windows
    uses: ./.github/workflows/profile-authority-stage.yml
    with:
      stage: mac_return
      os: macos-latest
      incoming: windows
