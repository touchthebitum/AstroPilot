name: Isolated corrected Windows upgrade qualification
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
      candidate_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  windows:
    name: Installed upgrade Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling/upgrade
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Retrieve exact candidates and verify checksums
        working-directory: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ inputs.approved_sha }}' -cne 'feb74d8032ac8d626e235ba04aeecd3f4ec9e381') { throw 'Unexpected SHA' }
          if ((git rev-parse HEAD).Trim() -cne '${{ inputs.approved_sha }}') { throw 'Wrong source' }
          $env:APPROVED_SHA='${{ inputs.approved_sha }}'
          $env:UV_CACHE_DIR=Join-Path $env:RUNNER_TEMP 'upgrade-uv-cache'
          uv sync --locked --extra test
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
          $inputRoot=Join-Path $env:RUNNER_TEMP 'upgrade-inputs'
          gh run download ${{ inputs.candidate_run }} -R touchthebitum/AstroPilot --name AstroPilot-beta8-windows-x86_64-feb74d8032ac8d626e235ba04aeecd3f4ec9e381 --dir (Join-Path $inputRoot 'current')
          if ($LASTEXITCODE -ne 0) { throw 'Current download failed' }
          gh run download 38732731103 -R touchthebitum/AstroPilot --name AstroPilot-beta8-windows-x86_64-0dcde494c8450176f445cc29b28d004eddb60734 --dir (Join-Path $inputRoot 'modern')
          if ($LASTEXITCODE -ne 0) { throw 'Previous download failed' }
          gh release download v1.0.0-beta.7 -R touchthebitum/AstroPilot --pattern '*windows-x86_64-setup.exe*' --dir (Join-Path $inputRoot 'legacy')
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          uv run --locked --no-sync python ../operations/tooling/upgrade/prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Artifact verification failed' }
      - name: Install predecessors and upgrade in disposable runner only
        working-directory: source
        shell: pwsh
        run: |
          $env:APPROVED_SHA='${{ inputs.approved_sha }}'
          $env:PRODUCT_SOURCE=(Get-Location).Path
          $env:UPGRADE_PROOF=Join-Path $env:RUNNER_TEMP 'installed-upgrade-proof'
          $inputRoot=Join-Path $env:RUNNER_TEMP 'upgrade-inputs'
          $env:CURRENT_CANDIDATE=Join-Path $inputRoot 'current/AstroPilot-1.0.0b8-windows-x86_64-setup.exe'
          $env:CURRENT_PAYLOAD=Join-Path $inputRoot 'current/unpacked/AstroPilot'
          $env:LEGACY_CANDIDATE=Join-Path $inputRoot 'legacy/AstroPilot-1.0.0b7-windows-x86_64-setup.exe'
          $env:MODERN_CANDIDATE=Join-Path $inputRoot 'modern/AstroPilot-1.0.0b8-windows-x86_64-setup.exe'
          $env:MODERN_SHA='0dcde494c8450176f445cc29b28d004eddb60734'
          uv run --locked --no-sync python ../operations/tooling/upgrade/qualify.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed upgrade qualification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-upgrade-windows
          path: |
            ${{ runner.temp }}/installed-upgrade-proof/upgrade-qualification.json
            ${{ runner.temp }}/installed-upgrade-proof/*/*.log
