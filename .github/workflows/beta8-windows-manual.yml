name: Verify Windows software-rendering diagnostic kit 7e98e45
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  software-variant:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tooling
          persist-credentials: false
      - name: Verify requested source
        shell: pwsh
        run: |
          if ('${{ inputs.approved_sha }}' -ne '7e98e45b2f46f57dcf959f3bf8d2b1373375cf48') { throw 'Unapproved product source' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '39035081606'
          name: NightMerit-installation-kit-windows-2022-7e98e45
          path: ${{ runner.temp }}/input-kit
      - name: Verify isolated WSB configuration without starting Sandbox
        shell: powershell
        run: ./tooling/software_sandbox/test_launch.ps1
      - name: Derive kit and verify complete manifest and frozen controller
        shell: powershell
        run: |
          python tooling/software_sandbox/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Variant integrity verification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: software-rendering-proof
          path: |
            ${{ runner.temp }}/software-launch-proof.json
            ${{ runner.temp }}/software-kit/variant-validation.json
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NightMerit-Windows-Logiciel-7e98e45
          path: |
            ${{ runner.temp }}/software-kit/*.zip
            ${{ runner.temp }}/software-kit/*.sha256
            ${{ runner.temp }}/software-kit/variant-validation.json
          retention-days: 30
