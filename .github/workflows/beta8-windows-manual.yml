name: Build and qualify isolated physical test kits 7e98e45
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  kits:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ inputs.approved_sha }}
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Reproduce and repair browser sandbox permissions in a disposable directory
        if: runner.os == 'Windows'
        run: python operations/tooling/physical70/diagnose_browser.py
      - name: Download exact official Windows portable
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '39030387705'
          name: AstroPilot-beta8-windows-x86_64-7e98e45b2f46f57dcf959f3bf8d2b1373375cf48
          path: ${{ runner.temp }}/official-windows
      - name: Build autonomous launchers and qualify real guide, candidate, resume and export
        shell: pwsh
        run: |
          python operations/tooling/physical70/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Kit qualification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: physical-kit-proof-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/physical70/build.log
            ${{ runner.temp }}/physical70/proof/
            ${{ runner.temp }}/physical70/runtime-proof/*.json
            ${{ runner.temp }}/physical70/runtime-proof/*.log
            ${{ runner.temp }}/physical70/kit-validation.json
            ${{ runner.temp }}/physical70/distribution-tests.xml
            ${{ runner.temp }}/sandbox-proof/result.json
            ${{ runner.temp }}/sandbox-proof/*.log
            ${{ runner.temp }}/sandbox-proof/*.html
            !${{ runner.temp }}/physical70/proof/**/browser-profile/**
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NightMerit-physical-kit-${{ matrix.os }}-7e98e45
          path: |
            ${{ runner.temp }}/physical70/NightMerit-Test-7e98e45-*.zip
            ${{ runner.temp }}/physical70/NightMerit-Test-7e98e45-*.zip.sha256
            ${{ runner.temp }}/physical70/kit-validation.json
          retention-days: 30
