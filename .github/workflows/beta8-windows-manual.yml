name: Timezone authority isolated Windows Mac qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling/timezone_authority
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: 5b1e813e65b8e300d99f06153728aea305abc6a9
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: false
      - name: Qualify system and package timezone sources and real browser
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python operations/tooling/timezone_authority/probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Timezone qualification failed or found divergence; preserve failure and export proofs' }
      - name: Export public timezone proof even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timezone-authority-${{ matrix.os }}
          path: ${{ runner.temp }}/timezone-authority-proof/
          retention-days: 14
