name: Read-only Windows OIII screenshot diagnostic
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ inputs.approved_sha }}
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Download exact official Windows candidate
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38919145126'
          name: AstroPilot-beta8-windows-x86_64-70ac6e0719cdc8c6ce76cbb7a2bfec1a24c82c9b
          path: ${{ runner.temp }}/official-windows
      - name: Download previously qualified public profile only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38921019839'
          name: packaged70-windows-2022
          path: ${{ runner.temp }}/prior-proof
      - name: Qualify actual packaged runtime with isolated public authority
        shell: pwsh
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RESHOOT_ONLY: 1
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node unavailable' }
          python operations/tooling/packaged70/bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw 'Qualification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: packaged70-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/packaged70/bootstrap.log
            ${{ runner.temp }}/packaged70/*candidate.json
            ${{ runner.temp }}/packaged70/*provenance.json
            ${{ runner.temp }}/packaged70/mac-signature.txt
            ${{ runner.temp }}/packaged70/proof/
            !${{ runner.temp }}/packaged70/proof/**/browser-profile/**
          retention-days: 14
