name: Qualify published beta7 migration to 7e98e45
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  migration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling
          persist-credentials: false
      - name: Verify exact approved source
        shell: pwsh
        run: |
          if ('${{ inputs.approved_sha }}' -ne '7e98e45b2f46f57dcf959f3bf8d2b1373375cf48') { throw 'Unapproved source' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ inputs.approved_sha }}
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: runner.os == 'macOS'
        with:
          github-token: ${{ github.token }}
          run-id: '39030606199'
          name: NightMerit-physical-kit-${{ matrix.os }}-7e98e45
          path: ${{ runner.temp }}/input-current
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: runner.os == 'Windows'
        with:
          github-token: ${{ github.token }}
          run-id: '39030387705'
          name: AstroPilot-beta8-windows-x86_64-7e98e45b2f46f57dcf959f3bf8d2b1373375cf48
          path: ${{ runner.temp }}/official-current
      - name: Fetch published beta7 assets (read only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = if ($IsWindows) { 'AstroPilot-1.0.0b7-windows-x86_64-setup.exe' } else { 'AstroPilot-1.0.0-beta.7-macos-arm64.zip' }
          gh release download v1.0.0-beta.7 --repo touchthebitum/AstroPilot --pattern $asset --dir "$env:RUNNER_TEMP/legacy"
          if ($LASTEXITCODE -ne 0) { throw 'Published asset download failed' }
      - name: Create locked qualification environment
        shell: pwsh
        run: |
          uv venv --python 3.13.5 .qualification
          if ($LASTEXITCODE -ne 0) { throw 'Environment failed' }
          $python = if ($IsWindows) { '.qualification/Scripts/python.exe' } else { '.qualification/bin/python' }
          uv pip sync --require-hashes --python $python operations/tooling/physical70/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependencies failed' }
          & $python operations/tooling/beta7migration/run.py
          if ($LASTEXITCODE -ne 0) { throw 'Beta7 migration qualification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: beta7-migration-proof-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/beta7migration/result.json
            ${{ runner.temp }}/beta7migration/partial-result.json
            ${{ runner.temp }}/beta7migration/*log
            ${{ runner.temp }}/beta7migration/*/stdout.log
            ${{ runner.temp }}/beta7migration/*/stderr.log
            ${{ runner.temp }}/beta7migration/*/beta7-origin.json
            ${{ runner.temp }}/beta7migration/*/ui-*/browser-result.json
            ${{ runner.temp }}/beta7migration/*/ui-*/driver.log
            ${{ runner.temp }}/beta7migration/*/ui-*/failure-state.json
            ${{ runner.temp }}/beta7migration/*/ui-*/*.png
          retention-days: 30
