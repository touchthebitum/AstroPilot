name: Compare direct and frozen Windows browser launches PR393
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling/physical70
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: 70ac6e0719cdc8c6ce76cbb7a2bfec1a24c82c9b
          sparse-checkout: scripts/ci/night_chain
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - run: python operations/tooling/physical70/network_matrix.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: frozen-network-matrix
          path: |
            ${{ runner.temp }}/network-matrix/matrix.json
            ${{ runner.temp }}/network-matrix/*.log
            ${{ runner.temp }}/network-matrix/*/result.json
            ${{ runner.temp }}/network-matrix/*/browser.log
          retention-days: 30
