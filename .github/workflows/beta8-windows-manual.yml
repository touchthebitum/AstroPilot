name: Beta8 Windows existing artifact weather diagnostics
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      UV_PROJECT_ENVIRONMENT: .venv-packaging
      UV_NO_ENV_FILE: '1'
      APPROVED_SHA: ${{ inputs.approved_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
      - name: Guard immutable sources and isolated runtime
        run: |
          if ($env:APPROVED_SHA -cne '3a39f4de1f620ccfcae2f2cd01f7719551ba1d38') { throw 'Unexpected SHA' }
          if ((git rev-parse HEAD).Trim() -cne $env:APPROVED_SHA) { throw 'Checkout mismatch' }
          $iso = Join-Path $env:RUNNER_TEMP 'weather-isolation'
          New-Item -ItemType Directory -Path $iso -ErrorAction Stop
          foreach ($entry in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';ASTROPILOT_DATA_DIR='data';UV_CACHE_DIR='cache';TMP='tmp';TEMP='tmp'}.GetEnumerator()) {
            $dir = Join-Path $iso $entry.Value
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            "$($entry.Key)=$dir" >> $env:GITHUB_ENV
          }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Install locked runtime only
        run: |
          uv python install 3.13.5
          if ($LASTEXITCODE -ne 0) { throw 'Python setup failed' }
          uv sync --locked --extra packaging
          if ($LASTEXITCODE -ne 0) { throw 'Runtime setup failed' }
          if (Test-Path astropilot.egg-info) { Move-Item astropilot.egg-info (Join-Path $env:RUNNER_TEMP 'weather-generated-metadata') }
          if (git status --porcelain --untracked-files=all) { throw 'Source changed' }
      - name: Download the delivered artifact and verify its exact ZIP hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'delivered-artifact'
          gh run download 38221698395 --repo touchthebitum/AstroPilot --name Beta8-common-windows-3a39f4de1f620ccfcae2f2cd01f7719551ba1d38 --dir "$download"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact retrieval failed' }
          $zip = Get-ChildItem -LiteralPath $download -Recurse -Filter 'AstroPilot-1.0.0b8-windows-x86_64-portable.zip'
          if (@($zip).Count -ne 1) { throw 'Unexpected ZIP inventory' }
          if ((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLower() -cne '269c3fc9d49a0587a1280c1457b57475ce8bd27ca23ae3ee20c87ce3c9ce6575') { throw 'Delivered ZIP hash mismatch' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'delivered-portable'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpacked
          "DIAGNOSTIC_BINARY=$(Join-Path $unpacked 'AstroPilot\AstroPilot.exe')" >> $env:GITHUB_ENV
      - name: Build a diagnostic twin without modifying product sources
        run: |
          $env:DIAGNOSTIC_SOURCE_ROOT = (Get-Location).Path
          $env:DIAGNOSTIC_RUNTIME_HOOK = (Resolve-Path ../operations/tooling/weather_runtime_hook.py).Path
          $env:ASTROPILOT_BUILD_COMMIT = '3a39f4d'
          $env:PYINSTALLER_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'weather-pyinstaller-cache'
          $dest = Join-Path $env:RUNNER_TEMP 'weather-diagnostic-dist'
          $build = Join-Path $env:RUNNER_TEMP 'weather-diagnostic-build'
          uv run --locked --no-sync python -m PyInstaller --noconfirm --clean --distpath "$dest" --workpath "$build" ../operations/tooling/diagnostic_windows.spec
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic twin build failed' }
          "DIAGNOSTIC_TWIN=$(Join-Path $dest 'AstroPilot/AstroPilot.exe')" >> $env:GITHUB_ENV
          if (git status --porcelain --untracked-files=all) { throw 'Product source changed' }
      - name: Compare original artifact, diagnostic twin and Python
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'weather-diagnostics'
          uv run --locked --no-sync python ../operations/tooling/weather_twin.py --original "$env:DIAGNOSTIC_BINARY" --diagnostic "$env:DIAGNOSTIC_TWIN" --source . --out "$out"
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic harness error' }
          if (git status --porcelain --untracked-files=all) { throw 'Source changed' }
      - name: Preserve diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Beta8-weather-diagnostics-${{ inputs.approved_sha }}
          path: ${{ runner.temp }}/weather-diagnostics/*
          include-hidden-files: false
          retention-days: 30
