name: Qualify httpx2 PR 259 in isolated Windows and Mac copies
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  httpx:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling/httpx259
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ inputs.approved_sha }}
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Qualify the exact lock and real local HTTP failures with isolated data
        shell: pwsh
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          if ($env:APPROVED_SHA -cne '40a2d333378486319eb279bc456884d5f5f17e4d') { throw 'Unexpected candidate SHA' }
          $env:PRODUCT_SOURCE=(Resolve-Path candidate).Path
          $env:HTTPX_PROOF=Join-Path $env:RUNNER_TEMP 'httpx259-proof'
          $env:UV_PROJECT_ENVIRONMENT=Join-Path $env:RUNNER_TEMP 'httpx259-venv'
          $env:UV_CACHE_DIR=Join-Path $env:RUNNER_TEMP 'httpx259-cache'
          $env:UV_NO_ENV_FILE='1'
          $env:NODE_BINARY=(Get-Command node -ErrorAction Stop).Source
          uv sync --project candidate --locked --extra test --python 3.13.5
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          uv run --project candidate --locked --no-sync python operations/tooling/httpx259/qualify.py
          if ($LASTEXITCODE -ne 0) { throw 'HTTP and replay qualification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: httpx259-proof-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/httpx259-proof/*.json
            ${{ runner.temp }}/httpx259-proof/*.xml
            ${{ runner.temp }}/httpx259-proof/*.log
          retention-days: 30
