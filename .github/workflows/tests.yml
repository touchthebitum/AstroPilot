name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.5"
          enable-cache: true

      - name: Install project and test dependencies
        run: uv sync --locked --extra test

      - name: Require Node.js for dynamic UI tests
        run: node --version

      - name: Run test suite
        run: uv run --locked --no-sync python -m pytest -q

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke test installed wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          wheel="$(pwd)/$wheel"
          smoke_test="$(pwd)/tests/installed_cli_smoke.py"
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$wheel" \
            astropilot --help
          uv run --isolated --no-project --with "$wheel" python -c \
            "from decision.filtering.target_semantics_resolver import TargetSemanticsResolver; assert TargetSemanticsResolver.resolve('IC1396', {'type': 'nebula'}) == ('nebula', 'emission')"
          uv run --isolated --no-project --with "$wheel" \
            python "$smoke_test"

  history-windows-capabilities:
    name: Outcome History Windows fail-closed
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          version: "0.12.5"
          enable-cache: true
      - name: Install project and test dependencies
        run: uv sync --locked --extra test
      - name: Run capability, native GET, key and signed cursor tests
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/history/test_outcome_history_secure_fs.py
          tests/history/test_outcome_history_cursor_codec.py
          tests/history/test_outcome_history_cursor_key.py::test_concurrent_initialization_and_restart
          tests/history/test_outcome_history_cursor_key.py::test_concurrent_process_initialization
          tests/history/test_outcome_history_cursor_key.py::test_corrupt_key_fails_without_rotation
          tests/history/test_outcome_history_cursor_key.py::test_regular_existing_key_loads
          tests/history/test_outcome_history_cursor_key.py::test_existing_key_preserves_binary_bytes
          tests/history/test_outcome_history_cursor_key.py::test_key_open_includes_binary_flag
      - name: Validate acceptance lineage persistence on Windows
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/architecture/test_decision_acceptance_lineage_persistence.py
      - name: Validate Windows notification adapter without sending notifications
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/architecture/test_opportunity_alert_windows_notification_v1.py
      - name: Validate Windows task XML and isolated child supervision without registering tasks
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/architecture/test_opportunity_alert_windows_task_v1.py
          tests/architecture/test_opportunity_alert_windows_supervisor_v1.py
          tests/architecture/test_opportunity_alert_status_v1.py
          tests/architecture/test_opportunity_alert_host_status_integration.py
          tests/architecture/test_opportunity_alert_host_v1.py

  guardian-portable-transport:
    name: Guardian transport and supervision ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.12"
          version: "0.12.5"
      - run: uv sync --locked --extra test
      - name: Validate native child lifetime and supervision without installing startup jobs or live HTTP
        run: uv run --locked --no-sync python -m pytest -q tests/guardian

  session-progress-portability:
    name: Session replay and progress ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.12"
          version: "0.12.5"
      - run: uv sync --locked --extra test
      - name: Require Node for real session UI helpers
        run: node --version
      - name: Validate sessions, credits, Guardian and profile recovery in isolated directories
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'session-progress-tests'
          foreach ($entry in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';ASTROPILOT_DATA_DIR='data';TMP='tmp';TEMP='tmp';TMPDIR='tmp';XDG_CACHE_HOME='cache'}.GetEnumerator()) {
            $dir = Join-Path $iso $entry.Value
            New-Item -ItemType Directory -Force $dir | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key, $dir)
          }
          uv run --locked --no-sync python -m pytest -q tests/api/test_durable_read_recovery.py tests/architecture/test_durable_directory_read.py tests/api/test_project_progress_restore_consistency.py tests/api/test_intent_progress_persistence_diagnostics.py tests/api/test_execution_session_api.py tests/api/test_execution_session_ui.py tests/api/test_project_progress_api.py tests/services/test_intent_progress_credit.py tests/services/test_execution_outcome_application.py tests/services/test_execution_transition.py tests/architecture/test_execution_lineage_persistence.py tests/guardian/test_guardian_session_lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw 'Session replay and progress tests failed' }
          $report = Join-Path $env:RUNNER_TEMP 'profile-recovery.xml'
          uv run --locked --no-sync python -m pytest -q tests/api/test_profile_decoding_recovery.py --junitxml="$report"
          if ($LASTEXITCODE -ne 0) { throw 'Profile recovery regressions failed' }
          [xml]$results = Get-Content -LiteralPath $report -Raw
          $cases = $results.SelectNodes('//testcase')
          $unsuccessful = $results.SelectNodes('//testcase/skipped | //testcase/failure | //testcase/error')
          if ($cases.Count -ne 11 -or $unsuccessful.Count -ne 0) {
            throw 'Expected all 11 profile recovery regressions to execute and pass without skips.'
          }
          $observationsReport = Join-Path $env:RUNNER_TEMP 'saved-observations.xml'
          uv run --locked --no-sync python -m pytest -q tests/api/test_analysis_history.py tests/api/test_saved_observation_catalogue.py tests/api/test_outcome_evaluation_ui.py tests/api/test_data_context.py tests/api/test_runtime_identity.py tests/api/test_private_kit_context.py tests/api/test_profile_backup.py tests/api/test_profile_transfer_ui.py tests/architecture/test_private_macos_launcher.py tests/architecture/test_private_windows_browser.py tests/api/test_stable_beta_data.py tests/architecture/test_stable_beta_native.py --junitxml="$observationsReport"
          if ($LASTEXITCODE -ne 0) { throw 'Saved observation catalogue and comparison UI regressions failed' }
      - name: Validate Windows host copy context with native PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File scripts/private_beta_windows/test_context.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Private kit host context regressions failed' }
      - name: Validate readable mission times in isolated Windows and Mac environments
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'mission-time-tests'
          foreach ($entry in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';ASTROPILOT_DATA_DIR='data';TMP='tmp';TEMP='tmp';TMPDIR='tmp';XDG_CACHE_HOME='cache'}.GetEnumerator()) {
            $dir = Join-Path $iso $entry.Value
            New-Item -ItemType Directory -Force $dir | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key, $dir)
          }
          $report = Join-Path $env:RUNNER_TEMP 'mission-times.xml'
          uv run --locked --no-sync python -m pytest -q tests/api/test_mission_task_times_ui.py tests/architecture/test_timezone_authority.py tests/api/test_timezone_authority_transport.py --junitxml="$report"
          if ($LASTEXITCODE -ne 0) { throw 'Mission local time regressions failed' }
      - name: Export saved observation regressions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: saved-observations-${{ matrix.os }}
          path: ${{ runner.temp }}/saved-observations.xml
          retention-days: 14
      - name: Export native mission time regressions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mission-times-${{ matrix.os }}
          path: ${{ runner.temp }}/mission-times.xml
          retention-days: 14
      - name: Export native profile recovery results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-recovery-${{ matrix.os }}
          path: ${{ runner.temp }}/profile-recovery.xml
          retention-days: 14
      - name: Validate native night and filter confirmation in a real browser
        shell: pwsh
        env:
          NIGHT_CHAIN_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $env:BROWSER_NATIVE_HOME=$env:HOME
          $env:NODE_BINARY=(Get-Command node -ErrorAction Stop).Source
          $env:NIGHT_CHAIN_PROOF=Join-Path $env:RUNNER_TEMP 'night-chain-proof'
          node scripts/ci/night_chain/browser_environment.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser environment isolation regression failed' }
          uv run --locked --no-sync python scripts/ci/night_chain/run.py
          if ($LASTEXITCODE -ne 0) { throw 'Native night confirmation browser journeys failed' }
      - name: Export native night confirmation browser proofs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: night-confirmation-${{ matrix.os }}
          path: ${{ runner.temp }}/night-chain-proof/
          retention-days: 14

  windows-packaging-provenance:
    name: Packaging provenance ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13.5'
          version: '0.12.6'
          enable-cache: false
      - run: uv sync --locked --extra test
      - name: Qualify compiler provenance and installer contracts in isolation
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'packaging-provenance'
          foreach ($key in @('HOME', 'USERPROFILE', 'APPDATA', 'LOCALAPPDATA', 'ASTROPILOT_DATA_DIR', 'TMP', 'TEMP', 'TMPDIR', 'XDG_CACHE_HOME')) {
            $path = Join-Path $iso $key
            New-Item -ItemType Directory -Force $path | Out-Null
            [Environment]::SetEnvironmentVariable($key, $path)
          }
          if ($IsWindows) {
            $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
            (Get-Item -LiteralPath $compiler).VersionInfo.FileVersion | Set-Content -LiteralPath (Join-Path $iso 'iscc-file-version.txt')
          }
          $env:INNO_PROVENANCE_TEST_REPORT = Join-Path $iso 'native-inno.json'
          uv run --locked --no-sync python -m pytest -q tests/architecture/test_windows_candidate_artifacts.py tests/architecture/test_windows_installer_contract.py --junitxml="$iso/tests.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging provenance regressions failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: packaging-provenance-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/packaging-provenance/tests.xml
            ${{ runner.temp }}/packaging-provenance/native-inno.json
            ${{ runner.temp }}/packaging-provenance/iscc-file-version.txt
          retention-days: 30

  private-beta-windows-candidate:
    name: Compiled private-beta snapshot Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: '3.13.5'
          version: '0.12.5'
          enable-cache: false
      - name: Verify exact clean source before packaging
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SOURCE_SHA) { throw 'Unexpected candidate source' }
          $dirty = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Candidate checkout is not clean' }
      - run: uv sync --locked --extra test --extra packaging
      - name: Compile the portable executable and exercise the complete synthetic upgrade graph
        shell: pwsh
        run: |
          $fullSha = (git rev-parse HEAD).Trim()
          $env:ASTROPILOT_BUILD_COMMIT = $fullSha.Substring(0,7)
          $env:ASTROPILOT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'private-beta-unused-identity-profile'
          uv run --locked --no-sync python -m PyInstaller --noconfirm --clean AstroPilot-windows.spec
          if ($LASTEXITCODE -ne 0) { throw 'Portable candidate build failed' }
          $candidate = Join-Path $PWD 'dist/AstroPilot'
          $identityText = & (Join-Path $candidate 'AstroPilot.exe') --runtime-identity
          if ($LASTEXITCODE -ne 0) { throw 'Frozen identity failed' }
          $identity = $identityText | ConvertFrom-Json
          if ($identity.application -cne 'astropilot' -or $identity.build -cne $fullSha.Substring(0,7) -or $identity.version -cne '1.0.0b8' -or $identity.architecture -cne 'x86_64') { throw 'Incorrect frozen identity' }
          $identityText | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'private-beta-runtime-identity.json') -Encoding utf8
          $fixture = Join-Path $env:RUNNER_TEMP 'private-beta-snapshot-fixture'
          $case = Join-Path $env:RUNNER_TEMP 'private-beta-snapshot-case'
          uv run --locked --no-sync python scripts/ci/private_beta_windows/make_snapshot_fixture.py --output $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Complete synthetic fixture failed' }
          & scripts/ci/private_beta_windows/frozen_stable_snapshot.ps1 -CandidateDirectory $candidate -FixtureDirectory $fixture -WorkDirectory $case -BuildSha $fullSha
          uv run --locked --no-sync python scripts/ci/private_beta_windows/verify_snapshot_proof.py --case-directory $case --fixture-directory $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Compiled snapshot archive verification failed' }
      - name: Retain synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-beta-windows-snapshot-proof
          path: |
            ${{ runner.temp }}/private-beta-runtime-identity.json
            ${{ runner.temp }}/private-beta-snapshot-case/proof.json
            ${{ runner.temp }}/private-beta-snapshot-fixture/fixture.json
          retention-days: 14
      - name: Retain the private portable candidate
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-beta-windows-candidate
          path: dist/AstroPilot/
          retention-days: 7
