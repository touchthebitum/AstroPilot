name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.5"
          enable-cache: true

      - name: Install project and test dependencies
        run: uv sync --locked --extra test

      - name: Require Node.js for dynamic UI tests
        run: node --version

      - name: Run test suite
        run: uv run --locked --no-sync python -m pytest -q

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke test installed wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          wheel="$(pwd)/$wheel"
          smoke_test="$(pwd)/tests/installed_cli_smoke.py"
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$wheel" \
            astropilot --help
          uv run --isolated --no-project --with "$wheel" python -c \
            "from decision.filtering.target_semantics_resolver import TargetSemanticsResolver; assert TargetSemanticsResolver.resolve('IC1396', {'type': 'nebula'}) == ('nebula', 'emission')"
          uv run --isolated --no-project --with "$wheel" \
            python "$smoke_test"

  history-windows-capabilities:
    name: Outcome History Windows fail-closed
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          version: "0.12.5"
          enable-cache: true
      - name: Install project and test dependencies
        run: uv sync --locked --extra test
      - name: Run capability, native GET, key and signed cursor tests
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/history/test_outcome_history_secure_fs.py
          tests/history/test_outcome_history_cursor_codec.py
          tests/history/test_outcome_history_cursor_key.py::test_concurrent_initialization_and_restart
          tests/history/test_outcome_history_cursor_key.py::test_concurrent_process_initialization
          tests/history/test_outcome_history_cursor_key.py::test_corrupt_key_fails_without_rotation
          tests/history/test_outcome_history_cursor_key.py::test_regular_existing_key_loads
          tests/history/test_outcome_history_cursor_key.py::test_existing_key_preserves_binary_bytes
          tests/history/test_outcome_history_cursor_key.py::test_key_open_includes_binary_flag
      - name: Validate acceptance lineage persistence on Windows
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/architecture/test_decision_acceptance_lineage_persistence.py
      - name: Validate Windows notification adapter without sending notifications
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/architecture/test_opportunity_alert_windows_notification_v1.py
      - name: Validate Windows task XML and isolated child supervision without registering tasks
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/architecture/test_opportunity_alert_windows_task_v1.py
          tests/architecture/test_opportunity_alert_windows_supervisor_v1.py
          tests/architecture/test_opportunity_alert_status_v1.py
          tests/architecture/test_opportunity_alert_host_status_integration.py
          tests/architecture/test_opportunity_alert_host_v1.py

  guardian-portable-transport:
    name: Guardian transport and supervision ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.12"
          version: "0.12.5"
      - run: uv sync --locked --extra test
      - name: Validate native child lifetime and supervision without installing startup jobs or live HTTP
        run: uv run --locked --no-sync python -m pytest -q tests/guardian

  session-progress-portability:
    name: Session replay and progress ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.12"
          version: "0.12.5"
      - run: uv sync --locked --extra test
      - name: Require Node for real session UI helpers
        run: node --version
      - name: Validate sessions, credits, Guardian and profile recovery in isolated directories
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'session-progress-tests'
          foreach ($entry in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';ASTROPILOT_DATA_DIR='data';TMP='tmp';TEMP='tmp';TMPDIR='tmp';XDG_CACHE_HOME='cache'}.GetEnumerator()) {
            $dir = Join-Path $iso $entry.Value
            New-Item -ItemType Directory -Force $dir | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key, $dir)
          }
          uv run --locked --no-sync python -m pytest -q tests/api/test_durable_read_recovery.py tests/architecture/test_durable_directory_read.py tests/api/test_project_progress_restore_consistency.py tests/api/test_intent_progress_persistence_diagnostics.py tests/api/test_execution_session_api.py tests/api/test_execution_session_ui.py tests/api/test_project_progress_api.py tests/services/test_intent_progress_credit.py tests/services/test_execution_outcome_application.py tests/services/test_execution_transition.py tests/architecture/test_execution_lineage_persistence.py tests/guardian/test_guardian_session_lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw 'Session replay and progress tests failed' }
          $report = Join-Path $env:RUNNER_TEMP 'profile-recovery.xml'
          uv run --locked --no-sync python -m pytest -q tests/api/test_profile_decoding_recovery.py --junitxml="$report"
          if ($LASTEXITCODE -ne 0) { throw 'Profile recovery regressions failed' }
          [xml]$results = Get-Content -LiteralPath $report -Raw
          $cases = $results.SelectNodes('//testcase')
          $unsuccessful = $results.SelectNodes('//testcase/skipped | //testcase/failure | //testcase/error')
          if ($cases.Count -ne 11 -or $unsuccessful.Count -ne 0) {
            throw 'Expected all 11 profile recovery regressions to execute and pass without skips.'
          }
      - name: Export native profile recovery results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-recovery-${{ matrix.os }}
          path: ${{ runner.temp }}/profile-recovery.xml
          retention-days: 14
