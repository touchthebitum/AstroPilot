name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.5"
          enable-cache: true

      - name: Install project and test dependencies
        run: uv sync --locked --extra test

      - name: Require Node.js for dynamic UI tests
        run: node --version

      - name: Run test suite
        run: uv run --locked --no-sync python -m pytest -q

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke test installed wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          wheel="$(pwd)/$wheel"
          smoke_test="$(pwd)/tests/installed_cli_smoke.py"
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$wheel" \
            astropilot --help
          uv run --isolated --no-project --with "$wheel" python -c \
            "from decision.filtering.target_semantics_resolver import TargetSemanticsResolver; assert TargetSemanticsResolver.resolve('IC1396', {'type': 'nebula'}) == ('nebula', 'emission')"
          uv run --isolated --no-project --with "$wheel" \
            python "$smoke_test"

  history-windows-capabilities:
    name: Outcome History Windows fail-closed
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          version: "0.12.5"
          enable-cache: true
      - name: Install project and test dependencies
        run: uv sync --locked --extra test
      - name: Run capability, native GET, key and signed cursor tests
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/history/test_outcome_history_secure_fs.py
          tests/history/test_outcome_history_cursor_codec.py
          tests/history/test_outcome_history_cursor_key.py::test_concurrent_initialization_and_restart
          tests/history/test_outcome_history_cursor_key.py::test_concurrent_process_initialization
          tests/history/test_outcome_history_cursor_key.py::test_corrupt_key_fails_without_rotation
          tests/history/test_outcome_history_cursor_key.py::test_regular_existing_key_loads
          tests/history/test_outcome_history_cursor_key.py::test_existing_key_preserves_binary_bytes
          tests/history/test_outcome_history_cursor_key.py::test_key_open_includes_binary_flag
      - name: Validate Windows notification adapter without sending notifications
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/architecture/test_opportunity_alert_windows_notification_v1.py
