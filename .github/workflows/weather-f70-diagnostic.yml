name: Isolated Windows weather diagnosis f70f2e4
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnosis:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          sparse-checkout: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: f70f2e4476b4ae7b58d1275615b9d4cd6d725ce2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/user_profile.json
            !/user_filters.json
            !/data/user_profile.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
          python-version: '3.13.5'
          enable-cache: false
      - name: Download exact validated portable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((git rev-parse HEAD).Trim() -cne 'f70f2e4476b4ae7b58d1275615b9d4cd6d725ce2') { throw 'SHA mismatch' }
          gh run download 38285317664 --repo $env:GITHUB_REPOSITORY --name Beta8-common-windows-f70f2e4476b4ae7b58d1275615b9d4cd6d725ce2 --dir (Join-Path $env:RUNNER_TEMP 'weather-download')
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
      - name: Compare binary and independent TLS clients
        run: |
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP 'weather-python-environment'
          uv sync --locked --no-install-project
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
          uv run --locked --no-sync python ../operations/tooling/diagnose_weather_f70.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic failed' }
          if (git status --porcelain --untracked-files=all) { throw 'Source changed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Windows-weather-f70-diagnostic
          path: ${{ runner.temp }}/weather-f70-diagnostic/results/*
          retention-days: 30
